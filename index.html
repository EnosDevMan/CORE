<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendamento online</title>
    <meta name="description" content="Consulte serviços, profissionais e horários disponíveis." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Agendamento online" />
    <meta property="og:description" content="Consulte serviços, profissionais e horários disponíveis." />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Agendamento online" />
    <meta name="twitter:description" content="Consulte serviços, profissionais e horários disponíveis." />
  </head>
  <body>
    <!--
      Conteúdo de segurança exibido antes de o JavaScript iniciar. O React
      substitui todo o conteúdo de #root assim que monta. Se o bundle não
      carregar (por exemplo, durante um deploy incompleto), a pessoa vê uma
      mensagem útil em vez de uma tela preta sem qualquer diagnóstico.

      Os estilos são inline de propósito: o CSS principal também é entregue
      pelo bundle do Vite e pode estar indisponível pelo mesmo motivo.
    -->
    <div id="root">
      <main
        role="status"
        aria-live="polite"
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:24px;background:#07182b;color:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif;text-align:center"
      >
        <div style="max-width:360px">
          <div aria-hidden="true" style="font-size:40px;line-height:1">📅</div>
          <h1 style="margin:20px 0 8px;font-size:22px">Agendamento online</h1>
          <p style="margin:0;color:#d8aa72;font-size:14px">Carregando a agenda…</p>
          <noscript>
            <p style="margin:16px 0 0;color:#cbd5e1;font-size:13px;line-height:1.5">
              Ative o JavaScript do navegador para acessar o agendamento.
            </p>
          </noscript>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
