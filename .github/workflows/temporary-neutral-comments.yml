name: Temporary neutral comments

on:
  push:
    branches:
      - chore/final-code-quality-20260825

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/final-code-quality-20260825
          fetch-depth: 0

      - name: Neutralize shared-domain comments
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            'src/features/booking/hooks/useBookingFlow.ts': [
              ('antes, "desativar" um barbeiro não', 'antes, "desativar" um profissional não'),
            ],
            'src/features/admin/hooks/useAdminReports.ts': [
              ('usado no painel do barbeiro', 'usado no painel do profissional'),
            ],
            'src/store/dataStore.ts': [
              ('(barbeiro e admin), o botão', '(profissional e proprietário), o botão'),
            ],
            'supabase/schema.sql': [
              ('-- Bucket para fotos de barbeiros: público para leitura (aparecem no site', '-- Bucket para fotos de profissionais: público para leitura (aparecem no site'),
              ("-- Bucket para a galeria de cortes (home page): mesmo padrão do 'avatars'.", "-- Bucket para a galeria pública (home page): mesmo padrão do 'avatars'."),
              ('-- Barbeiros podem enviar e substituir somente a própria foto de perfil.', '-- Profissionais podem enviar e substituir somente a própria foto de perfil.'),
              ('-- barbers: leitura pública, escrita só admin (exceto o próprio barbeiro,', '-- barbers: tabela física legada de profissionais; leitura pública e escrita administrativa (exceto o próprio profissional,'),
              ('-- bookings: cliente vê/cancela os seus; barbeiro vê e gerencia os da', '-- bookings: cliente vê/cancela os seus; profissional vê e gerencia os da'),
              ('-- por admin ou pelo próprio barbeiro (bloqueios da própria agenda).', '-- por proprietário ou pelo próprio profissional (bloqueios da própria agenda).'),
              ('-- Reagendamento exige estar autenticado (cliente, barbeiro ou admin) —', '-- Reagendamento exige estar autenticado (cliente, profissional ou proprietário) —'),
            ],
          }

          changed = []
          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            original = text
            for old, new in pairs:
              count = text.count(old)
              if count != 1:
                raise SystemExit(f'{filename}: expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
            if text != original:
              path.write_text(text)
              changed.append(filename)

          if not changed:
            raise SystemExit('No files changed.')
          print('Updated:', ', '.join(changed))

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/booking/hooks/useBookingFlow.ts src/features/admin/hooks/useAdminReports.ts src/store/dataStore.ts supabase/schema.sql
          git commit -m 'chore: neutralizar terminologia em comentários compartilhados'
          git push origin HEAD:chore/final-code-quality-20260825
