name: Temporary final schema sync

on:
  push:
    branches:
      - feat/professional-appearance-system-20260825

permissions:
  contents: write

jobs:
  sync-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/professional-appearance-system-20260825
          fetch-depth: 0

      - name: Apply final-state RLS definitions to consolidated schema
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('supabase/schema.sql')
          text = path.read_text()

          def replace_policy(name: str, replacement: str):
              global text
              pattern = rf"create policy {re.escape(name)}\b[\s\S]*?;\n"
              matches = re.findall(pattern, text, flags=re.IGNORECASE)
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one policy {name}, found {len(matches)}')
              text = re.sub(pattern, replacement.rstrip() + '\n', text, count=1, flags=re.IGNORECASE)

          if 'create index pet_notes_author_id_idx' not in text:
              marker = 'create index pet_notes_pet_created_idx on public.pet_notes(pet_id, created_at desc);\n'
              if text.count(marker) != 1:
                  raise SystemExit('pet_notes index marker not found exactly once')
              text = text.replace(marker, marker + 'create index pet_notes_author_id_idx on public.pet_notes(author_id);\n')

          replace_policy('profiles_select_own_or_admin', '''create policy profiles_select_own_or_admin on public.profiles for select
          using (((select auth.uid()) = id) or ((select public.auth_role()) = 'owner'));''')

          replace_policy('bookings_select_own_barber_or_admin', '''create policy bookings_select_own_barber_or_admin on public.bookings for select
          using (
            ((select auth.uid()) = customer_id)
            or ((select public.auth_role()) = 'owner')
            or (
              (select public.auth_role()) = 'professional'
              and barber_id = (
                select profiles.profile_id from public.profiles
                where profiles.id = (select auth.uid())
              )
            )
          );''')

          replace_policy('barbers_update_own', '''create policy barbers_update_own on public.barbers for update
          using ((select public.auth_role()) = 'owner' or user_id = (select auth.uid()))
          with check ((select public.auth_role()) = 'owner' or user_id = (select auth.uid()));''')

          replace_policy('barbers_write_admin', '''create policy barbers_insert_admin on public.barbers for insert
          with check ((select public.auth_role()) = 'owner');
          create policy barbers_delete_admin on public.barbers for delete
          using ((select public.auth_role()) = 'owner');''')

          replace_policy('booking_pets_admin_write', '''create policy booking_pets_admin_insert on public.booking_pets for insert
          with check ((select public.auth_role()) = 'owner' and public.capability_enabled('pets'));
          create policy booking_pets_admin_update on public.booking_pets for update
          using ((select public.auth_role()) = 'owner')
          with check ((select public.auth_role()) = 'owner' and public.capability_enabled('pets'));
          create policy booking_pets_admin_delete on public.booking_pets for delete
          using ((select public.auth_role()) = 'owner');''')

          replace_policy('booking_services_admin_write', '''create policy booking_services_admin_insert on public.booking_services for insert
          with check ((select public.auth_role()) = 'owner');
          create policy booking_services_admin_update on public.booking_services for update
          using ((select public.auth_role()) = 'owner') with check ((select public.auth_role()) = 'owner');
          create policy booking_services_admin_delete on public.booking_services for delete
          using ((select public.auth_role()) = 'owner');''')

          replace_policy('booking_settings_admin_write', '''create policy booking_settings_admin_insert on public.booking_settings for insert
          with check ((select public.auth_role()) = 'owner');
          create policy booking_settings_admin_update on public.booking_settings for update
          using ((select public.auth_role()) = 'owner') with check ((select public.auth_role()) = 'owner');
          create policy booking_settings_admin_delete on public.booking_settings for delete
          using ((select public.auth_role()) = 'owner');''')

          replace_policy('business_profile_admin_write', '''create policy business_profile_admin_insert on public.business_profile for insert
          with check ((select public.auth_role()) = 'owner');
          create policy business_profile_admin_update on public.business_profile for update
          using ((select public.auth_role()) = 'owner') with check ((select public.auth_role()) = 'owner');
          create policy business_profile_admin_delete on public.business_profile for delete
          using ((select public.auth_role()) = 'owner');''')

          replace_policy('feature_settings_admin_write', '''create policy feature_settings_admin_insert on public.feature_settings for insert
          with check ((select public.auth_role()) = 'owner');
          create policy feature_settings_admin_update on public.feature_settings for update
          using ((select public.auth_role()) = 'owner') with check ((select public.auth_role()) = 'owner');
          create policy feature_settings_admin_delete on public.feature_settings for delete
          using ((select public.auth_role()) = 'owner');''')

          replace_policy('gallery_photos_write_admin', '''create policy gallery_photos_insert_admin on public.gallery_photos for insert
          with check ((select public.auth_role()) = 'owner');
          create policy gallery_photos_update_admin on public.gallery_photos for update
          using ((select public.auth_role()) = 'owner') with check ((select public.auth_role()) = 'owner');
          create policy gallery_photos_delete_admin on public.gallery_photos for delete
          using ((select public.auth_role()) = 'owner');''')

          replace_policy('services_write_admin', '''create policy services_insert_admin on public.services for insert
          with check ((select public.auth_role()) = 'owner');
          create policy services_update_admin on public.services for update
          using ((select public.auth_role()) = 'owner') with check ((select public.auth_role()) = 'owner');
          create policy services_delete_admin on public.services for delete
          using ((select public.auth_role()) = 'owner');''')

          replace_policy('blocks_write_admin_or_own_barber', '''create policy blocks_insert_admin_or_own_barber on public.schedule_blocks for insert to authenticated
          with check (
            (select public.auth_role()) = 'owner'
            or barber_id = (select profiles.profile_id::text from public.profiles where profiles.id = (select auth.uid()))
          );
          create policy blocks_update_admin_or_own_barber on public.schedule_blocks for update to authenticated
          using (
            (select public.auth_role()) = 'owner'
            or barber_id = (select profiles.profile_id::text from public.profiles where profiles.id = (select auth.uid()))
          )
          with check (
            (select public.auth_role()) = 'owner'
            or barber_id = (select profiles.profile_id::text from public.profiles where profiles.id = (select auth.uid()))
          );
          create policy blocks_delete_admin_or_own_barber on public.schedule_blocks for delete to authenticated
          using (
            (select public.auth_role()) = 'owner'
            or barber_id = (select profiles.profile_id::text from public.profiles where profiles.id = (select auth.uid()))
          );''')

          replace_policy('pets_owner_or_admin_insert', '''create policy pets_owner_or_admin_insert on public.pets for insert
          with check (
            public.capability_enabled('pets')
            and (owner_id = (select auth.uid()) or (select public.auth_role()) = 'owner')
          );''')
          replace_policy('pets_owner_or_admin_read', '''create policy pets_owner_or_admin_read on public.pets for select
          using (owner_id = (select auth.uid()) or (select public.auth_role()) = 'owner');''')
          replace_policy('pets_owner_or_admin_update', '''create policy pets_owner_or_admin_update on public.pets for update
          using (owner_id = (select auth.uid()) or (select public.auth_role()) = 'owner')
          with check (
            public.capability_enabled('pets')
            and (owner_id = (select auth.uid()) or (select public.auth_role()) = 'owner')
          );''')

          replace_policy('pet_notes_related_read', '''create policy pet_notes_related_read on public.pet_notes for select
          using (
            (select public.auth_role()) = 'owner'
            or exists (
              select 1 from public.pets p
              where p.id = pet_notes.pet_id and p.owner_id = (select auth.uid())
            )
            or (
              (select public.auth_role()) = 'professional'
              and exists (
                select 1 from public.booking_pets bp
                join public.bookings b on b.id = bp.booking_id
                where bp.pet_id = pet_notes.pet_id
                  and b.barber_id = (
                    select profiles.profile_id from public.profiles
                    where profiles.id = (select auth.uid())
                  )
              )
            )
          );''')
          replace_policy('pet_notes_staff_write', '''create policy pet_notes_staff_write on public.pet_notes for insert
          with check (
            public.capability_enabled('pets')
            and author_id = (select auth.uid())
            and (select public.auth_role()) in ('owner', 'professional')
          );''')

          forbidden = [
              'barbers_write_admin', 'booking_pets_admin_write', 'booking_services_admin_write',
              'booking_settings_admin_write', 'business_profile_admin_write',
              'feature_settings_admin_write', 'gallery_photos_write_admin',
              'services_write_admin', 'blocks_write_admin_or_own_barber',
          ]
          for name in forbidden:
              if f'create policy {name}' in text.lower():
                  raise SystemExit(f'Legacy broad policy still present: {name}')
          if 'where bp.pet_id = pet_notes.pet_id' not in text:
              raise SystemExit('Correlated pet_notes policy is missing')
          if 'create index pet_notes_author_id_idx' not in text:
              raise SystemExit('pet_notes author index is missing')

          path.write_text(text)

      - name: Commit consolidated schema
        run: |
          if git diff --quiet -- supabase/schema.sql; then
            echo 'Schema already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema.sql
          git commit -m 'fix(db): consolidar RLS final no schema'
          git push origin HEAD:feat/professional-appearance-system-20260825
