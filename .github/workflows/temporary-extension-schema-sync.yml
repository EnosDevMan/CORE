name: Temporary extension schema sync

on:
  push:
    branches:
      - fix/relocate-btree-gist-20260825

permissions:
  contents: write

jobs:
  sync-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/relocate-btree-gist-20260825
          fetch-depth: 0

      - name: Synchronize extension placement in consolidated schema
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/schema.sql')
          text = path.read_text()

          extension_header = '''-- ============================================================================
          -- 1. EXTENSIONS
          -- ============================================================================
          create extension if not exists "pgcrypto";'''.replace('          ', '')
          replacement = '''-- ============================================================================
          -- 1. EXTENSIONS
          -- ============================================================================
          create schema if not exists extensions;
          create extension if not exists "pgcrypto";
          create extension if not exists btree_gist with schema extensions;'''.replace('          ', '')

          legacy_late_install = 'create extension if not exists btree_gist;'

          if text.count(extension_header) != 1:
              raise SystemExit('Expected exactly one consolidated extensions header.')
          if text.count(legacy_late_install) != 1:
              raise SystemExit('Expected exactly one legacy late btree_gist install.')

          text = text.replace(extension_header, replacement)
          text = text.replace(legacy_late_install, '-- btree_gist is installed in the dedicated extensions schema above.')

          if text.count('create extension if not exists btree_gist with schema extensions;') != 1:
              raise SystemExit('btree_gist secure installation is not unique.')
          if legacy_late_install in text:
              raise SystemExit('Legacy public-schema btree_gist installation remains.')

          path.write_text(text)

      - name: Commit consolidated schema
        run: |
          if git diff --quiet -- supabase/schema.sql; then
            echo 'Schema already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema.sql
          git commit -m 'fix(db): instalar btree_gist em extensions no schema'
          git push origin HEAD:fix/relocate-btree-gist-20260825
