name: Run production readiness remediation

on:
  push:
    branches:
      - fix/production-readiness-20260828

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Restore validated on-demand history baseline
        run: |
          git fetch origin perf/admin-history-on-demand
          for path in \
            src/services/bootstrapDataService.ts \
            src/store/AppDataLoader.tsx \
            src/features/admin/hooks/useAdminReports.ts \
            src/features/admin/components/AdminAgendaTab.tsx \
            src/features/admin/components/AdminClientsTab.tsx \
            src/features/admin/components/AdminReportsTab.tsx \
            src/features/admin/components/agenda/AdminRescheduleDialog.tsx \
            supabase/schema.sql \
            supabase/tests/admin_history_on_demand.sql; do
            git show origin/perf/admin-history-on-demand:$path > "$path"
          done
          git show origin/perf/admin-history-on-demand:supabase/migrations/20260828002000_admin_history_on_demand.sql > supabase/migrations/20260828013701_admin_history_on_demand.sql
          python .github/production-readiness-fix.py
          python .github/fix-admin-history-service.py
          python .github/trim-production-remediation.py
      - run: npm ci
      - name: Validate application
        run: npm run verify
      - name: Commit validated remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase/schema.sql supabase/migrations/20260828013701_admin_history_on_demand.sql supabase/tests/admin_history_on_demand.sql
          git commit -m "Harden production admin history and availability"
          git push origin HEAD:fix/production-readiness-20260828
