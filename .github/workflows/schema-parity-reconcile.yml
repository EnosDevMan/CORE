name: Reconcile consolidated schema parity

on:
  push:
    branches: [fix/admin-state-sync-and-schema-parity]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admin-state-sync-and-schema-parity
      - name: Reconcile schema with validated incremental boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          schema_path = Path('supabase/schema.sql')
          schema = schema_path.read_text()
          marker = '-- 12. FINAL PRODUCTION PARITY RECONCILIATION'
          if marker in schema:
              raise SystemExit(0)

          def migration_body(path: str) -> str:
              lines = Path(path).read_text().splitlines()
              # schema.sql already owns the outer transaction. Historical
              # migration wrappers must not commit the consolidated bootstrap.
              return '\n'.join(
                  line for line in lines
                  if line.strip().lower() not in {'begin;', 'commit;'}
              ).strip()

          sources = [
              'supabase/migrations/20260826210000_branding_cover_storage.sql',
              'supabase/migrations/20260827113000_fix_working_hours_trigger_permissions.sql',
              'supabase/migrations/20260827182247_schedule_blocks_update_grant.sql',
              'supabase/migrations/20260827190000_appearance_surface_and_custom_colors.sql',
              'supabase/migrations/20260827213000_sync_admin_business_identity.sql',
          ]
          parity = '\n\n'.join(migration_body(path) for path in sources)
          trailer = f'''\n\n-- ============================================================================\n-- 12. FINAL PRODUCTION PARITY RECONCILIATION\n-- ============================================================================\n-- Fresh projects execute only this file. Keep the latest validated production\n-- boundaries here as well as in their incremental migrations so an empty\n-- installation cannot silently miss a hotfix or a newly introduced contract.\n\n{parity}\n'''

          needle = '\ncommit;\n'
          if needle not in schema:
              raise SystemExit('schema.sql final commit anchor not found')
          schema = schema.rsplit(needle, 1)[0] + trailer + needle
          schema_path.write_text(schema)
          PY
      - name: Commit reconciled schema
        run: |
          if git diff --quiet -- supabase/schema.sql; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/schema.sql
          git commit -m "Reconcile schema.sql with production state [skip ci]"
          git push origin HEAD:fix/admin-state-sync-and-schema-parity
