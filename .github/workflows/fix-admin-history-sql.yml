name: Fix admin history SQL

on:
  push:
    branches:
      - perf/admin-history-on-demand

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Quote reserved time identifier
        run: |
          python .github/fix-admin-history-sql.py
          rm -f .github/fix-admin-history-sql.py .github/workflows/fix-admin-history-sql.yml
      - name: Commit SQL fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Quote admin history time column"
          git push origin HEAD:perf/admin-history-on-demand
