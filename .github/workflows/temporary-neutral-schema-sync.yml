name: Temporary neutral schema sync

on:
  push:
    branches:
      - chore/neutralize-legacy-defaults-20260825

permissions:
  contents: write

jobs:
  sync-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/neutralize-legacy-defaults-20260825
          fetch-depth: 0

      - name: Synchronize neutral compatibility defaults
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/schema.sql')
          text = path.read_text()

          old_single_tenant = '''--   * "single-tenant": existe apenas 1 barbearia por projeto Supabase, por
          --     isso `barbershop_config` tem sempre uma única linha (id fixo `true`).'''.replace('          ', '')
          new_single_tenant = '''--   * "single-tenant": existe apenas 1 negócio por projeto Supabase;
          --     `barbershop_config` é um nome físico legado de compatibilidade e mantém
          --     sempre uma única linha (id fixo `true`).'''.replace('          ', '')

          old_default = "name text not null default 'Barbearia' check (char_length(btrim(name)) between 2 and 100),"
          new_default = "name text not null default 'CORE' check (char_length(btrim(name)) between 2 and 100),"

          old_insert = 'insert into barbershop_config (id) values (true);'
          new_insert = '''insert into barbershop_config (id) values (true);
          comment on table public.barbershop_config is
            'Legacy physical compatibility configuration for the single CORE business installation. Application code uses the neutral BusinessConfig contract.';
          comment on column public.barbershop_config.name is
            'Compatibility business name. Fresh installations use the neutral CORE default until onboarding persists the real business identity.';'''.replace('          ', '')

          old_gallery = '-- gallery_photos (fotos de cortes exibidas na home page)'
          new_gallery = '-- gallery_photos (mídia pública exibida na home page)'

          replacements = [
              (old_single_tenant, new_single_tenant, 'single-tenant compatibility comment'),
              (old_default, new_default, 'neutral business-name default'),
              (old_insert, new_insert, 'compatibility table comments'),
              (old_gallery, new_gallery, 'neutral gallery comment'),
          ]

          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one {label}; found {text.count(old)}')
              text = text.replace(old, new)

          if "default 'Barbearia'" in text:
              raise SystemExit('Legacy Barbearia default remains in consolidated schema.')
          if text.count("default 'CORE'") < 1:
              raise SystemExit('Neutral CORE default was not written.')
          if text.count('Legacy physical compatibility configuration') != 1:
              raise SystemExit('Compatibility table comment was not written exactly once.')

          path.write_text(text)

      - name: Commit consolidated schema
        run: |
          if git diff --quiet -- supabase/schema.sql; then
            echo 'Schema already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema.sql
          git commit -m 'fix(db): neutralizar identidade padrão no schema'
          git push origin HEAD:chore/neutralize-legacy-defaults-20260825
