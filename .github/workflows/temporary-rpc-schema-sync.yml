name: Temporary RPC schema sync

on:
  push:
    branches:
      - fix/rpc-surface-hardening-20260825

permissions:
  contents: write

jobs:
  sync-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rpc-surface-hardening-20260825
          fetch-depth: 0

      - name: Internalize first-owner claim
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/schema.sql')
          text = path.read_text()

          old = '''revoke all on function public.claim_first_owner(text) from public, anon;
          grant execute on function public.claim_first_owner(text) to authenticated;'''.replace('          ', '')
          new = '''revoke all on function public.claim_first_owner(text)
            from public, anon, authenticated, service_role;
          comment on function public.claim_first_owner(text) is
            'Internal first-owner claim used only by the atomic onboarding RPC. No browser or service-role Data API execute grant.';'''.replace('          ', '')

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one direct claim grant block; found {text.count(old)}')
          text = text.replace(old, new)

          if 'grant execute on function public.claim_first_owner(text) to authenticated;' in text:
              raise SystemExit('Authenticated direct claim grant remains in consolidated schema.')
          if text.count('Internal first-owner claim used only by the atomic onboarding RPC.') != 1:
              raise SystemExit('Internal claim comment was not written exactly once.')

          path.write_text(text)

      - name: Commit consolidated schema
        run: |
          if git diff --quiet -- supabase/schema.sql; then
            echo 'Schema already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema.sql
          git commit -m 'fix(db): internalizar claim no schema consolidado'
          git push origin HEAD:fix/rpc-surface-hardening-20260825
