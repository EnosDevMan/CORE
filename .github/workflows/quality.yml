name: Quality

on:
  pull_request:
  push:
    branches: [main, work]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: core_test
    steps:
      - uses: actions/checkout@v7
      - name: Validate consolidated schema and authorization boundaries
        run: >-
          psql --set ON_ERROR_STOP=1
          --file supabase/tests/standalone_bootstrap.sql
          --file supabase/schema.sql
          --file supabase/tests/data_api_grants.sql
          --file supabase/tests/extensions_security.sql
          --file supabase/tests/branding_storage_security.sql
          --file supabase/tests/universal_defaults.sql
          --file supabase/tests/rpc_surface_security.sql
          --file supabase/tests/authorization_roles.sql
          --file supabase/tests/booking_overlap.sql
          --file supabase/tests/booking_security.sql
          --file supabase/tests/pet_notes_authorization.sql
