name: Run project hardening

on:
  push:
    branches:
      - perf/project-wide-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply source transformations
        run: |
          python .github/hardening.py
          python .github/fix-hardening-tests.py
          python .github/cleanup-dead-data-service.py
          rm -f .github/hardening.py .github/fix-hardening-tests.py .github/cleanup-dead-data-service.py .github/workflows/run-project-hardening.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate project
        run: npm run verify
      - name: Commit validated hardening pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reduce broad subscriptions and repeated admin work"
          git push origin HEAD:perf/project-wide-hardening
